<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23F2B705%27/%3E%3Cpath d=%27M16 6.5 25 11v10l-9 4.5L7 21V11l9-4.5Z%27 fill=%27%2315212B%27/%3E%3C/svg%3E">
<meta name="theme-color" content="#15212B">
<title>Gudang AI: penerimaan barang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8ECEF;--panel:#FFFFFF;--ink:#15212B;--muted:#5A6873;--line:#C9D1D7;--soft:#F3F5F7;
  --accent:#F2B705;--accent-ink:#2A2000;
  --ok:#23784A;--ok-bg:#E1F2E8;--warn:#8A5800;--warn-bg:#FFF1CC;--bad:#B3261E;--bad-bg:#FBE3E1;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F171D;--panel:#18232B;--ink:#E6ECF0;--muted:#93A3AE;--line:#2C3A44;--soft:#1E2A33;
  --ok:#6FD39A;--ok-bg:#173526;--warn:#F5C451;--warn-bg:#3A2E0F;--bad:#FF8A80;--bad-bg:#3E1A18;}}
:root[data-theme="dark"]{
  --bg:#0F171D;--panel:#18232B;--ink:#E6ECF0;--muted:#93A3AE;--line:#2C3A44;--soft:#1E2A33;
  --ok:#6FD39A;--ok-bg:#173526;--warn:#F5C451;--warn-bg:#3A2E0F;--bad:#FF8A80;--bad-bg:#3E1A18;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
img{max-width:100%}
.stripe{height:10px;background:repeating-linear-gradient(-45deg,var(--accent) 0 14px,#15212B 14px 28px)}
h1{font-family:var(--cond);font-weight:700;font-size:30px;line-height:1;margin:0;letter-spacing:.2px}
h2{font-family:var(--cond);font-weight:600;font-size:22px;margin:0 0 10px}
h3{font-family:var(--cond);font-weight:600;font-size:18px;margin:0 0 6px}
.mode{font-size:13px;color:var(--muted);margin:4px 0 0}
main{width:100%;max-width:1180px;padding:24px 28px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 16px;box-shadow:0 1px 2px rgba(21,33,43,.05)}
.muted{color:var(--muted)}.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:10px 14px;cursor:pointer;min-height:44px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label.file:focus-within{outline:3px solid var(--accent);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:90px}
label.f{display:block;font-size:14px;color:var(--muted);margin:0 0 4px}
.po{display:block;width:100%;text-align:left;font-weight:400;padding:14px;margin:0 0 10px}
.po b{font-family:var(--cond);font-size:20px;font-weight:600}
.chip{display:inline-block;font-size:13px;font-weight:600;border-radius:99px;padding:2px 10px;border:1px solid transparent}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-warn{background:var(--warn-bg);color:var(--warn)}.c-bad{background:var(--bad-bg);color:var(--bad)}.c-n{background:var(--soft);color:var(--muted);border-color:var(--line)}
.scanbox{display:flex;gap:8px}
.scanbox input#scan{font-size:20px;font-family:var(--cond);letter-spacing:.5px}
.scanbox input#mult{width:78px;flex:none;text-align:center}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th{font-size:13px;color:var(--muted);font-weight:500;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{font-family:var(--cond);font-size:22px;font-weight:600;line-height:1.1}
td input{width:70px;min-height:38px;padding:6px 8px;font-family:var(--cond);font-size:18px}
tr.flash td{background:var(--warn-bg)}
.stamp{border:3px solid currentColor;border-radius:10px;padding:12px 16px;font-family:var(--cond);font-weight:700;font-size:28px;line-height:1.1}
.stamp small{display:block;font-family:var(--body);font-weight:500;font-size:14px;margin-top:4px}
.s-ok{color:var(--ok);background:var(--ok-bg)}
.stamp.s-bad{position:relative;overflow:hidden;padding-top:20px}
.stamp.s-bad::before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:var(--hazard-stripe)}.s-warn{color:var(--warn);background:var(--warn-bg)}.s-bad{color:var(--bad);background:var(--bad-bg)}
.sig{width:100%;height:150px;background:#fff;border:1px dashed var(--muted);border-radius:8px;touch-action:none;display:block}
label.file{display:inline-flex;align-items:center;justify-content:center;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer;background:var(--panel)}
label.file input{position:absolute;opacity:0;width:1px;height:1px}
.ai{border-left:4px solid var(--accent);border-radius:0;background:var(--soft);padding:10px 12px;margin-top:10px;font-size:15px}
.ai ul{margin:6px 0 0;padding-left:18px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
.itemrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.itemrow .full{grid-column:1/-1}
.stock{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.stock:last-child{border-bottom:0}
.big{font-family:var(--cond);font-size:28px;font-weight:600;line-height:1}
.steps{counter-reset:s}
.step h3::before{counter-increment:s;content:counter(s) ". "}

.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;padding:0;background:var(--ink);border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;z-index:7;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.fab svg{width:44px;height:44px}
.buddy{position:fixed;z-index:8;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:400px;max-width:calc(100vw - 32px);height:min(640px,calc(100vh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)));background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.buddy[hidden]{display:none}
@media (max-width:560px){.buddy{right:0;left:0;bottom:0;width:100%;max-width:100%;height:calc(100% - 40px - env(safe-area-inset-top,0px));border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}}
.bhead{background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px}
.bhead .av{width:40px;height:40px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.bhead .av svg{width:32px;height:32px}
.bhead b{font-family:var(--cond);font-size:20px;display:block;line-height:1}
.bhead span{font-size:13px;opacity:.75}
.bhead button{background:transparent;border:0;color:var(--bg);min-height:40px;padding:6px 10px;font-size:14px}
.bstripe{height:6px;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,#15212B 10px 20px)}
.bbody{flex:1;overflow-y:auto;padding:14px}
.hello{text-align:center;padding:8px 6px 4px}
.hello svg{width:120px;height:120px}
.hello h3{font-size:22px;margin:6px 0 4px}
.sugg{display:block;width:100%;text-align:left;font-weight:500;margin:0 0 8px;color:var(--ink);background:var(--soft)}
.msg{margin:0 0 12px;max-width:88%;padding:10px 12px;border-radius:12px;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.msg.u{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{background:var(--soft);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg ul{margin:4px 0;padding-left:18px}.msg p{margin:0 0 6px}.msg p:last-child{margin:0}
.msg .att{font-size:13px;opacity:.8;display:block;margin-top:4px}
.chart{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.chart h4{font-family:var(--cond);font-size:16px;margin:0 0 8px;font-weight:600}
.bar{display:grid;grid-template-columns:minmax(70px,38%) 1fr auto;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.bar i{display:block;height:14px;background:var(--accent);border-radius:3px}
.bfoot{border-top:1px solid var(--line);padding:10px}
.bin{border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:6px}
.bin textarea{border:0;background:transparent;min-height:44px;max-height:120px;resize:none;padding:6px 8px}
.bin textarea:focus-visible{outline:none}
.bin:focus-within{outline:3px solid var(--accent);outline-offset:1px}
.bin .row{justify-content:space-between}
.bin label.file,.bin button{min-height:40px;padding:6px 12px;font-size:14px}
.bnote{font-size:12px;color:var(--muted);text-align:center;margin:6px 0 0}
.dots::after{content:"…"}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.role{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:1px 6px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:0 0 12px}
.toolbar h2{margin:0}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.filters button{min-height:36px;padding:4px 12px;font-size:14px;font-weight:500}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.urow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.urow:last-child{border-bottom:0}
.urow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.urow select{width:auto;min-height:38px;padding:4px 8px}
.urow button{min-height:38px;padding:4px 10px;font-size:14px}
@media (max-width:560px){.urow{grid-template-columns:1fr}.urow .acts{justify-content:flex-start}}
.log{font-size:14px;border-bottom:1px solid var(--line);padding:8px 0}
.log:last-child{border-bottom:0}
.log time{color:var(--muted);font-size:13px;display:block}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:12px}
/* ---------- app shell ---------- */
:root{--side:#15212B;--side-ink:#C9D3DA;--side-mute:#7F909C;--side-hover:#1F2E3A}
:root{--hz:6px;--hazard-stripe:repeating-linear-gradient(-45deg,var(--accent) 0 12px,#15212B 12px 24px)}
.hazard{position:fixed;top:0;left:0;right:0;height:calc(var(--hz) + env(safe-area-inset-top,0px));background:var(--hazard-stripe);z-index:30}
body{padding-top:var(--hz)}
.shell{display:flex;min-height:calc(100vh - var(--hz))}
.side{position:sticky;top:var(--hz);height:calc(100vh - var(--hz));width:248px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px}
.brand svg{width:36px;height:36px;flex:none}
.brand b{display:block;font-family:var(--cond);font-size:22px;line-height:1;color:#fff;letter-spacing:.3px}
.brand span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-mute)}
.sidenav{display:flex;flex-direction:column;gap:2px}
.sidenav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--side-ink);font-family:var(--body);font-weight:500;font-size:15px;text-align:left;padding:10px 12px;min-height:44px;border-radius:8px;position:relative}
.sidenav button:hover{background:var(--side-hover);color:#fff}
.sidenav button[aria-current="true"]{background:var(--side-hover);color:#fff}
.sidenav button[aria-current="true"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--accent)}
.sidenav button[aria-current="true"] .ic{color:var(--accent)}
.sidenav button[hidden]{display:none}
.sidefoot{margin:auto 10px 0;font-size:12px;color:var(--side-mute);line-height:1.4}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:var(--hz);z-index:6;display:flex;align-items:center;gap:14px;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 24px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.tb-brand{display:none}
.tb-brand svg{width:34px;height:34px;display:block}
.tb-title{flex:1;min-width:0}
.tb-title h1{font-family:var(--cond);font-weight:700;font-size:24px;line-height:1.1;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title p{margin:2px 0 0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title p:empty{display:none}
.usermenu{position:relative}
.ubtn{display:flex;align-items:center;gap:10px;border:1px solid transparent;background:transparent;padding:4px 8px 4px 4px;border-radius:999px;min-height:44px;font-weight:500}
.ubtn:hover,.ubtn[aria-expanded="true"]{background:var(--soft);border-color:var(--line)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--cond);font-weight:700;font-size:16px;flex:none}
.uname{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;text-align:left}
.uname b{font-size:14px;font-weight:600;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uname span{font-size:12px;color:var(--muted)}
.ubtn .ic{width:16px;height:16px;color:var(--muted)}
.umenu{position:absolute;right:0;top:calc(100% + 6px);min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;z-index:20}
.umhead{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.umhead b{display:block;font-size:15px}
.umhead span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.umenu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;font-weight:500;font-size:15px;padding:8px 10px;min-height:40px;border-radius:6px}
.umenu button:hover{background:var(--soft)}
.umenu button.danger{color:var(--bad)}
.tabs{display:none}
/* beranda */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:0 0 16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;font-weight:400;min-height:0;display:block;width:100%;box-shadow:0 1px 2px rgba(21,33,43,.05)}
button.kpi:hover{border-color:var(--muted)}
.kpi .k{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .k .ic{width:16px;height:16px}
.kpi .v{font-family:var(--cond);font-size:34px;font-weight:700;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.alert{border-color:var(--bad);background:var(--bad-bg);position:relative;overflow:hidden;padding-top:20px}
.kpi.alert::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:var(--hazard-stripe)}
.kpi.alert .v,.kpi.alert .k{color:var(--bad)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.card .toolbar{flex-wrap:nowrap}
.linkbtn{border:0;background:none;min-height:36px;padding:4px 2px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;flex:none}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li>div{min-width:0}
.list button{min-height:36px;padding:4px 12px;font-size:14px;flex:none}
.hello-band{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.hello-band h2{font-size:26px;margin:0}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .side{display:none}
  .tb-brand{display:block}
  .topbar{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .topbar{top:var(--hz)}
  .tb-title h1{font-size:21px}
  .uname,.ubtn>.ic{display:none}
  .ubtn{padding:2px;border-radius:50%}
  main{padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px))}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;border-radius:0;background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;padding:8px 2px 7px;min-height:58px;position:relative}
  .tabs button[hidden]{display:none}
  .tabs button .ic{width:22px;height:22px}
  .tabs button[aria-current="true"]{color:var(--ink)}
  .tabs button[aria-current="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
  .grid2{grid-template-columns:1fr}
}
@media (min-width:901px){.fab{bottom:24px;right:24px}#toast{bottom:28px}}
@media print{
  body{background:#fff;color:#000;padding:0}
  .hazard,.side,.topbar,.tabs,.fab,.buddy,#toast,.noprint{display:none!important}
  body{padding-top:0}
  .shell{display:block}
  .card{border:0;padding:0}
  main{max-width:none;padding:0}
}
</style>
</head>
<body>
<div class="hazard" aria-hidden="true"></div>
<div class="shell">
<aside class="side" aria-label="Navigasi utama">
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#F2B705"/><path d="M16 6.5 25 11v10l-9 4.5L7 21V11l9-4.5Z" fill="#15212B"/><path d="m7 11 9 4.5 9-4.5M16 15.5v10" fill="none" stroke="#F2B705" stroke-width="1.6" stroke-linejoin="round"/></svg><div><b>Gudang</b><span>Tanpa kertas</span></div></div>

<section class="buddy" id="buddy" hidden aria-label="Gudi, asisten AI gudang">
  <div class="bhead"><div class="av"><svg viewBox="0 0 64 64" aria-hidden="true"><line x1="32" y1="6" x2="32" y2="14" stroke="#15212B" stroke-width="2.5"/><circle cx="32" cy="6" r="3.5" fill="#F2B705" stroke="#15212B" stroke-width="2"/><path d="M10 22 L32 14 L54 22 L54 50 L32 58 L10 50 Z" fill="#C8955A" stroke="#15212B" stroke-width="2.5" stroke-linejoin="round"/><path d="M10 22 L32 30 L54 22" fill="none" stroke="#15212B" stroke-width="2.5" stroke-linejoin="round"/><path d="M32 30 L32 58" stroke="#15212B" stroke-width="2"/><rect x="14" y="34" width="36" height="8" fill="#F2B705" transform="skewY(0)"/><circle cx="23" cy="45" r="3" fill="#15212B"/><circle cx="41" cy="45" r="3" fill="#15212B"/><path d="M27 51 Q32 54 37 51" fill="none" stroke="#15212B" stroke-width="2" stroke-linecap="round"/></svg></div><div style="flex:1"><b>Gudi</b><span>Asisten AI gudang Anda</span></div><button data-b="new" aria-label="Mulai obrolan baru">Baru</button><button data-b="close" aria-label="Tutup">Tutup</button></div>
  <div class="bstripe" aria-hidden="true"></div>

  <div class="row"><span id="battach"></span><span class="row" style="gap:6px"><span id="bimg"></span><button class="primary" data-b="send" id="bsend">Kirim</button></span></div></div>
  <p class="bnote">Gudi bisa keliru. Cek ulang angka penting sebelum mengambil keputusan.</p></div>
</section>
<div id="toast" role="status"></div>
<script src="/claude-shim.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('id-ID').format(n||0);
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const COLS=['pos','stok','grn','config'];
const state={pos:{},stok:{},grn:{},config:{}};
let ready=false,backend=null,db=null,user=null,uid=null,sample=null,caps=null,readOnly=false;
let tab='beranda',rx=null,poDraft=null,grnView=null,stokQ='',ai={busy:null};
let myRole='petugas',grnFilter='semua',adminData=null,adminBusy=false;
const ROLES=['viewer','petugas','supervisor','admin'],ROLE_LABEL={viewer:'Viewer',petugas:'Petugas',supervisor:'Supervisor',admin:'Admin'};
const can=r=>ROLES.indexOf(myRole)>=ROLES.indexOf(r);
const names={};

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)}
const tol=()=>Number(state.config.settings?.toleransi??2);

async function init(){
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(db){
    backend='db';let n=0;
    COLS.forEach(c=>db.collection(c).onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());state[c]=o;if(!ready&&++n>=COLS.length)ready=true;render()},e=>toast('Sinkronisasi data berhenti ('+e.code+'). Muat ulang halaman.')));
    $('#mode').textContent='Data tersimpan bersama untuk tim gudang';
  }else{
    backend='local';
    try{const s=JSON.parse(localStorage.getItem('gudang-ai-v1')||'null');if(s)COLS.forEach(c=>state[c]=s[c]||{})}catch(e){}
    ready=true;$('#mode').textContent='Mode lokal: data hanya tersimpan di perangkat ini';render();
  }
  try{user=window.claude?await window.claude.use('user'):null;uid=user?await user.id():null}catch(e){}
  try{sample=window.claude?await window.claude.use('sample'):null;caps=sample?await sample.limits().catch(()=>null):null}catch(e){}
  try{if(user){const m=await user.me();meName=m.name||'';myRole=m.role||'petugas'}}catch(e){}
  readOnly=!can('petugas');
  if(meName&&window.gudangLogout){
    const ini=meName.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
    $('#whoav').textContent=ini||'?';$('#whoname').textContent=meName;$('#whoname2').textContent=meName;$('#whoemail').textContent=(uid||'')+' · '+(ROLE_LABEL[myRole]||myRole);
    $('#whorole').textContent=ROLE_LABEL[myRole]||myRole;$('#who').hidden=false;$('#logout').onclick=()=>window.gudangLogout();
  }
  document.querySelectorAll('.navadmin').forEach(b=>b.hidden=!can('admin'));
  render();if(!$('#buddy').hidden)renderChat();
}
async function put(col,id,data){
  if(backend==='db'){
    try{await db.collection(col).doc(id).set(data)}
    catch(e){if(e&&e.code==='forbidden')throw new Error(e.message||'Akun Anda tidak punya izin untuk tindakan ini.');
      if(e&&e.code==='invalid_argument'){readOnly=true;render();throw new Error('Akun Anda hanya bisa melihat data, tidak bisa menyimpan.')}
      if(e&&e.code==='quota_exceeded')throw new Error('Penyimpanan penuh. Hapus data lama lalu coba lagi.');throw new Error('Gagal menyimpan ('+(e&&e.code||'error')+'). Coba lagi.')}
  }else{state[col][id]=data;try{localStorage.setItem('gudang-ai-v1',JSON.stringify(state))}catch(e){}render()}
}

function supplierRisk(sup){
  const g=Object.values(state.grn).filter(x=>x.supplier===sup);if(g.length<2)return null;
  const r=g.filter(x=>x.hasil!=='Diterima').length/g.length;
  return{r,n:g.length,level:r>=.5?'tinggi':r>=.25?'sedang':'rendah'};
}
function riskChip(sup){const k=supplierRisk(sup);if(!k)return'<span class="chip c-n">Riwayat supplier belum cukup</span>';
  const cls=k.level==='tinggi'?'c-bad':k.level==='sedang'?'c-warn':'c-ok';
  return`<span class="chip ${cls}">Risiko supplier ${k.level} (${Math.round(k.r*100)}% dari ${k.n} kiriman bermasalah)</span>`}

function evaluate(){
  const po=state.pos[rx.poId],t=tol();
  const rows=po.items.map(it=>{
    const f=Number(rx.fisik[it.sku]||0),r=Math.min(Number(rx.rusak[it.sku]||0),f),sjRaw=rx.sj[it.sku];
    const sj=sjRaw===''||sjRaw==null?null:Number(sjRaw);const baik=f-r,diff=baik-it.qty;
    const pct=it.qty?Math.abs(diff)/it.qty*100:0;const sjBeda=sj!=null&&sj!==f;
    const sjPct=sjBeda?Math.abs(sj-f)/Math.max(f,1)*100:0;const notes=[];
    if(diff<0)notes.push('Kurang '+fmt(-diff));if(diff>0)notes.push('Lebih '+fmt(diff));
    if(r)notes.push(fmt(r)+' rusak');if(sjBeda)notes.push('Surat jalan '+fmt(sj)+', fisik '+fmt(f));
    let status;
    if(f===0)status='belum';
    else if(diff===0&&!sjBeda&&r===0)status='sesuai';
    else if(pct<=t&&sjPct<=t)status='catatan';
    else status='tahan';
    return{sku:it.sku,nama:it.nama,satuan:it.satuan,po:it.qty,sj,fisik:f,rusak:r,baik,status,notes};
  });
  const unk=rx.unknown.length;let hasil;
  if(rows.every(r=>r.status==='sesuai')&&!unk)hasil='Diterima';
  else if(rows.some(r=>r.status==='tahan'||r.status==='belum')||unk)hasil='Ditahan';
  else hasil='Diterima dengan catatan';
  return{rows,hasil,unk};
}
const stChip={sesuai:'<span class="chip c-ok">Sesuai</span>',catatan:'<span class="chip c-warn">Dalam toleransi</span>',tahan:'<span class="chip c-bad">Ditahan</span>',belum:'<span class="chip c-n">Belum discan</span>'};

function startRx(id){rx={poId:id,sj:{},fisik:{},rusak:{},unknown:[],sjNo:'',pengirim:'',catatan:'',approved:false,sign:null,aiSJ:null,inspeksi:[],last:null};tab='terima';render();setTimeout(()=>$('#scan')?.focus(),50)}
function scan(raw){
  const parts=raw.trim();if(!parts)return;const po=state.pos[rx.poId];
  const m=Math.max(1,parseInt($('#mult')?.value||'1',10)||1);
  const it=po.items.find(i=>String(i.barcode)===parts||i.sku.toLowerCase()===parts.toLowerCase());
  if(it){rx.fisik[it.sku]=(Number(rx.fisik[it.sku])||0)+m;rx.last=it.sku;toast('+'+m+' '+it.nama)}
  else{rx.unknown.push(parts);toast('Kode '+parts+' tidak ada di PO ini')}
  render();
}

function viewTerima(){
  if(!rx){
    const open=Object.entries(state.pos).filter(([,p])=>p.status!=='Diterima').sort((a,b)=>String(a[1].tanggal).localeCompare(String(b[1].tanggal)));
    if(!open.length)return`<div class="card"><h2>Belum ada PO yang menunggu</h2><p class="muted">Buat PO dulu, lalu barang yang datang bisa diverifikasi di sini.</p>${can('supervisor')?'<button class="primary" data-act="newpo">Buat PO</button>':''}</div>`;
    return`<h2>Pilih PO untuk kiriman yang datang</h2>`+open.map(([id,p])=>`<button class="po card" data-act="start" data-id="${esc(id)}">
      <div class="row between"><b>${esc(p.no)}</b>${p.status==='Ditahan'?'<span class="chip c-bad">Ditahan</span>':'<span class="chip c-n">Menunggu</span>'}</div>
      <div>${esc(p.supplier)}</div><div class="small muted">${p.items.length} jenis barang, ${fmt(p.items.reduce((a,i)=>a+Number(i.qty),0))} unit, dipesan ${esc(p.tanggal||'')}</div>
      <div style="margin-top:6px">${riskChip(p.supplier)}</div></button>`).join('');
  }
  const po=state.pos[rx.poId];if(!po){rx=null;return viewTerima()}
  const ev=evaluate(),t=tol();
  const canImg=!!caps?.images,canAI=!!sample;
  const stampCls=ev.hasil==='Diterima'?'s-ok':ev.hasil==='Ditahan'?'s-bad':'s-warn';
  const stampSub=ev.hasil==='Diterima'?'Semua barang cocok dengan PO dan surat jalan.':ev.hasil==='Ditahan'?'Ada selisih di atas toleransi '+t+'%, barang rusak, atau barang belum discan. Perlu persetujuan supervisor.':'Ada selisih kecil dalam toleransi '+t+'%. Barang bisa diterima dengan catatan.';
  return`
  <div class="row between" style="margin-bottom:10px"><div><h2 style="margin:0">${esc(po.no)}</h2><div class="muted small">${esc(po.supplier)}</div></div><button class="ghost" data-act="cancelrx">Batal</button></div>
  <div style="margin-bottom:12px">${riskChip(po.supplier)}</div>
  <div class="steps">
  <section class="card step"><h3>Dokumen dari supplier</h3>
    <p class="small muted" style="margin:0 0 10px">${canAI?'AI membaca surat jalan dan mencocokkan tiap baris ke barang di PO, walau namanya ditulis berbeda.':'Isi jumlah sesuai surat jalan di tabel di bawah.'}</p>
    <div class="row">
      ${canAI&&canImg?`<label class="file">Foto surat jalan<input type="file" accept="${esc(caps.images.mediaTypes.join(','))}" capture="environment" id="sjfile"></label>`:''}
      ${canAI?`<button data-act="sjtextshow">Tempel teks surat jalan</button>`:''}
    </div>
    ${rx.showSJText?`<div style="margin-top:10px"><label class="f" for="sjtext">Teks surat jalan atau email dari supplier</label><textarea id="sjtext" placeholder="Contoh: Beras Pandan Wangi 5kg - 40 sak">${esc(rx.sjText||'')}</textarea><button class="primary" style="margin-top:8px" data-act="sjtext">Baca dengan AI</button></div>`:''}
    ${ai.busy==='sj'?'<div class="ai">AI sedang membaca surat jalan…</div>':''}
    ${rx.aiSJ?`<div class="ai"><b>Hasil baca AI${rx.aiSJ.nomor_surat_jalan?' untuk surat jalan '+esc(rx.aiSJ.nomor_surat_jalan):''}</b><ul>${(rx.aiSJ.baris||[]).map(b=>`<li>${esc(b.teks_asli)} → ${b.sku?esc((po.items.find(i=>i.sku===b.sku)||{}).nama||b.sku)+', '+fmt(b.qty):'<b>tidak ada di PO</b>'} <span class="muted">(${esc(b.yakin||'')}: ${esc(b.alasan||'')})</span></li>`).join('')}</ul>${rx.aiSJ.catatan?`<p class="small" style="margin:6px 0 0">${esc(rx.aiSJ.catatan)}</p>`:''}</div>`:''}
    <div style="margin-top:10px"><label class="f" for="sjno">Nomor surat jalan</label><input id="sjno" data-bind="sjNo" value="${esc(rx.sjNo)}"></div>
  </section>
  <section class="card step"><h3>Scan barang fisik</h3>
    <p class="small muted" style="margin:0 0 10px">Arahkan scanner barcode ke kolom ini, atau ketik kode barcode/SKU lalu tekan Enter. Isi kolom kanan untuk scan per karton.</p>
    <div class="scanbox"><input id="scan" inputmode="text" autocomplete="off" placeholder="Scan barcode atau SKU" aria-label="Kode barcode atau SKU"><input id="mult" type="number" min="1" value="${esc(rx.mult||1)}" aria-label="Jumlah per scan"></div>
    ${rx.unknown.length?`<div class="ai"><b>Kode di luar PO:</b> ${rx.unknown.map(esc).join(', ')} <button class="ghost small" data-act="clearunk">Hapus</button></div>`:''}
    <div class="row" style="margin-top:10px">
      ${canAI&&canImg?`<label class="file">Cek kondisi dengan foto<input type="file" accept="${esc(caps.images.mediaTypes.join(','))}" capture="environment" id="inspfile"></label>`:''}
    </div>
    ${ai.busy==='foto'?'<div class="ai">AI sedang memeriksa foto barang…</div>':''}
    ${rx.inspeksi.map(x=>`<div class="ai"><span class="chip ${x.kondisi==='baik'?'c-ok':x.kondisi==='rusak'?'c-bad':'c-warn'}">Kondisi ${esc(x.kondisi)}</span>${x.temuan?.length?`<ul>${x.temuan.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}${x.saran?`<p class="small" style="margin:6px 0 0">${esc(x.saran)}</p>`:''}</div>`).join('')}
  </section>
  <section class="card step"><h3>Pencocokan otomatis</h3>
    <div class="wrap"><table><thead><tr><th>Barang</th><th>PO</th><th>Surat jalan</th><th>Fisik</th><th>Rusak</th><th>Status</th></tr></thead><tbody>
    ${ev.rows.map(r=>`<tr class="${rx.last===r.sku?'flash':''}"><td><b>${esc(r.nama)}</b><div class="small muted">${esc(r.sku)}, ${esc(r.satuan)}</div>${r.notes.length?`<div class="small">${esc(r.notes.join('. '))}</div>`:''}</td>
      <td class="num">${fmt(r.po)}</td>
      <td><input type="number" min="0" data-q="sj" data-sku="${esc(r.sku)}" id="sj-${esc(r.sku)}" value="${r.sj??''}" aria-label="Jumlah surat jalan ${esc(r.nama)}"></td>
      <td><input type="number" min="0" data-q="fisik" data-sku="${esc(r.sku)}" id="fs-${esc(r.sku)}" value="${r.fisik}" aria-label="Jumlah fisik ${esc(r.nama)}"></td>
      <td><input type="number" min="0" data-q="rusak" data-sku="${esc(r.sku)}" id="rs-${esc(r.sku)}" value="${r.rusak}" aria-label="Jumlah rusak ${esc(r.nama)}"></td>

async function resolveNames(ids){

}

async function approveGRN(id){
  const g=clone(state.grn[id]);if(!g||g.keputusan!=='Ditahan')return;
  const d=new Date();
  try{
    await put('grn',id,{...g,keputusan:'Diterima, disetujui supervisor'});
    for(const r of g.items){if(r.baik<=0)continue;const cur=clone(state.stok[r.sku]);
      await put('stok',r.sku,{sku:r.sku,nama:r.nama,satuan:r.satuan,qty:(Number(cur.qty)||0)+r.baik,lokasi:cur.lokasi||suggestLokasi(),update:d.toISOString()})}
    const po=clone(state.pos[g.poId]);if(po.no){po.status='Diterima';await put('pos',g.poId,po)}
    toast('Disetujui. Stok sudah bertambah.');render();
  }catch(e){toast(e.message)}
}
function downloadCSV(name,rows){
  const cell=v=>{const t=String(v??'');return/[",;\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
  const csv='\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function csvStok(){
  const rows=[['SKU','Nama barang','Jumlah','Satuan','Lokasi rak','Diperbarui']];
  Object.values(state.stok).sort((a,b)=>String(a.sku).localeCompare(String(b.sku))).forEach(s=>rows.push([s.sku,s.nama,s.qty,s.satuan,s.lokasi||'',s.update?new Date(s.update).toLocaleString('id-ID'):'']));
  downloadCSV('stok-'+new Date().toISOString().slice(0,10)+'.csv',rows);
}
function csvGRN(){
  const rows=[['No GRN','Waktu','No PO','Supplier','No surat jalan','Keputusan','Petugas','Disetujui oleh','Pengirim','SKU','Nama barang','Satuan','Qty PO','Qty surat jalan','Qty fisik','Qty rusak','Qty baik','Catatan baris']];
  Object.values(state.grn).sort((a,b)=>String(a.waktu).localeCompare(String(b.waktu))).forEach(g=>g.items.forEach(r=>rows.push([g.no,new Date(g.waktu).toLocaleString('id-ID'),g.poNo,g.supplier,g.sjNo||'',g.keputusan,names[g.petugas]||g.petugas||'',g.disetujuiOleh?(names[g.disetujuiOleh]||g.disetujuiOleh):'',g.pengirim||'',r.sku,r.nama,r.satuan,r.po,r.sj??'',r.fisik,r.rusak,r.baik,(r.notes||[]).join('. ')])));
  downloadCSV('penerimaan-'+new Date().toISOString().slice(0,10)+'.csv',rows);
}

  $('#pagetitle').textContent=T[0];$('#pagesub').textContent=T[1];document.title=T[0]+' · Gudang tanpa kertas';
  if(!ready){$('#app').innerHTML='<p class="muted">Memuat data gudang…</p>';return}
  const a=document.activeElement,id=a&&a.id;let ss=null,se=null;try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}
  if(tab==='admin'&&!can('admin'))tab='terima';
  $('#app').innerHTML=tab==='beranda'?viewBeranda():tab==='terima'?viewTerima():tab==='po'?viewPO():tab==='stok'?viewStok():tab==='akun'?viewAkun():tab==='admin'?viewAdmin():viewRiwayat();
  bindSign();
  if(id){const el=document.getElementById(id);if(el){el.focus({preventScroll:true});try{if(ss!=null)el.setSelectionRange(ss,se)}catch(e){}}}
}

function bindSign(){
  const c=$('#sign');if(!c||!rx)return;const x=c.getContext('2d');
  x.lineWidth=3;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#15212B';
  if(rx.sign){const im=new Image();im.onload=()=>x.drawImage(im,0,0);im.src=rx.sign}
  let on=false;const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.onpointerdown=e=>{on=true;c.setPointerCapture(e.pointerId);const[a,b]=pt(e);x.beginPath();x.moveTo(a,b)};
  c.onpointermove=e=>{if(!on)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke()};
  c.onpointerup=c.onpointercancel=()=>{if(!on)return;on=false;rx.sign=c.toDataURL('image/png')};
}

async function aiReadSJ(files,text){
  if(!sample)return;const po=state.pos[rx.poId];ai.busy='sj';render();
  const prompt=`Kamu membantu petugas gudang memverifikasi barang masuk.
Daftar barang di Purchase Order ${po.no} dari ${po.supplier} (JSON): ${JSON.stringify(po.items.map(i=>({sku:i.sku,nama:i.nama,satuan:i.satuan,qty_po:i.qty})))}
${files?'Gambar terlampir adalah foto surat jalan (delivery note) dari supplier.':'Teks surat jalan dari supplier:\n"""\n'+text+'\n"""'}
Baca setiap baris barang di surat jalan. Cocokkan tiap baris ke SKU di PO walaupun namanya ditulis berbeda (singkatan, merek, ukuran). Konversikan jumlah ke satuan PO hanya jika isi per kemasan tertulis jelas.
Balas HANYA dengan JSON berbentuk:
{"nomor_surat_jalan": string atau null, "baris":[{"teks_asli": string, "sku": string atau null, "qty": number atau null, "yakin": "tinggi"|"sedang"|"rendah", "alasan": string}], "catatan": string}
Isi sku dengan null jika baris tidak cocok dengan barang mana pun di PO. Tulis alasan dan catatan dalam bahasa Indonesia, singkat.`;
  try{
    const res=await sample.json(prompt,files?{images:files}:{});
    rx.aiSJ=res;(res.baris||[]).forEach(b=>{if(b.sku&&po.items.some(i=>i.sku===b.sku)&&typeof b.qty==='number')rx.sj[b.sku]=b.qty});
    if(res.nomor_surat_jalan&&!rx.sjNo)rx.sjNo=res.nomor_surat_jalan;rx.showSJText=false;toast('Jumlah surat jalan terisi dari hasil baca AI');
  }catch(e){toast(e.code==='not_granted'?'Izin AI tidak diberikan':e.code==='rate_limited'?'AI sedang sibuk, coba sebentar lagi':'AI gagal membaca dokumen. Isi jumlah secara manual.')}
  ai.busy=null;render();
}
async function aiInspect(files){
  if(!sample)return;const po=state.pos[rx.poId];ai.busy='foto';render();
  const prompt=`Foto terlampir adalah barang yang baru diterima di gudang untuk PO ${po.no} (barang: ${po.items.map(i=>i.nama).join(', ')}).
Periksa kondisi kemasan: penyok, sobek, basah atau bocor, segel rusak, label tidak terbaca, tanda kedaluwarsa jika terlihat.
Balas HANYA dengan JSON: {"kondisi":"baik"|"rusak"|"ragu","temuan":[string],"saran":string}. Bahasa Indonesia, singkat.`;
  try{const res=await sample.json(prompt,{images:files});rx.inspeksi.push({kondisi:res.kondisi||'ragu',temuan:res.temuan||[],saran:res.saran||''})}
  catch(e){toast(e.code==='not_granted'?'Izin AI tidak diberikan':'AI gagal memeriksa foto. Coba foto yang lebih jelas.')}
  ai.busy=null;render();
}

function suggestLokasi(){
  const used=new Set(Object.values(state.stok).map(s=>s.lokasi));
  for(const z of['A','B','C','D'])for(let n=1;n<=20;n++){const l=z+'-'+String(n).padStart(2,'0');if(!used.has(l))return l}
  return'E-01';
}
async function saveGRN(){
  const ev=evaluate();
  if(ev.rows.every(r=>r.fisik===0)){toast('Scan barang dulu sebelum menyimpan');return}
  if(!rx.sign){toast('Minta tanda tangan pengirim dulu');return}
  const po=clone(state.pos[rx.poId]);
  const keputusan=ev.hasil==='Ditahan'?(rx.approved?'Diterima, disetujui supervisor':'Ditahan'):ev.hasil;
  const accepted=keputusan!=='Ditahan';const d=new Date();
  const id='GRN-'+d.toISOString().replace(/[-:T]/g,'').slice(0,14);
  const g={no:id,poId:rx.poId,poNo:po.no,supplier:po.supplier,waktu:d.toISOString(),petugas:uid,hasil:ev.hasil,keputusan,items:ev.rows,unknown:rx.unknown,sjNo:rx.sjNo,pengirim:rx.pengirim,catatan:rx.catatan,inspeksi:rx.inspeksi,ttd:rx.sign};
  const btn=$('[data-act="savegrn"]');if(btn){btn.disabled=true;btn.textContent='Menyimpan…'}
  try{
    await put('grn',id,g);
    if(accepted)for(const r of ev.rows){if(r.baik<=0)continue;const cur=clone(state.stok[r.sku]);
      await put('stok',r.sku,{sku:r.sku,nama:r.nama,satuan:r.satuan,qty:(Number(cur.qty)||0)+r.baik,lokasi:cur.lokasi||suggestLokasi(),update:d.toISOString()})}
    po.status=accepted?'Diterima':'Ditahan';po.grn=id;await put('pos',g.poId,po);
    rx=null;tab='riwayat';grnView=id;toast(accepted?'Diterima. Stok sudah bertambah.':'Disimpan sebagai ditahan. Stok belum bertambah.');render();
  }catch(e){toast(e.message);if(btn){btn.disabled=false;btn.textContent='Simpan penerimaan'}}
}

function md(t){const lines=esc(t).split('\n');let h='',inL=false;for(let l of lines){l=l.replace(/^#+\s*/,'').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');const m=l.match(/^\s*(?:[-•*]|\d+\.)\s+(.*)/);if(m){if(!inL){h+='<ul>';inL=true}h+='<li>'+m[1]+'</li>'}else{if(inL){h+='</ul>';inL=false}if(l.trim())h+='<p>'+l+'</p>'}}if(inL)h+='</ul>';return h}
function chartHTML(c){const max=Math.max(...c.data.map(d=>d.nilai),1);return`<div class="chart"><h4>${esc(c.judul)}</h4>${c.data.map(d=>`<div class="bar"><span>${esc(d.label)}</span><i style="width:${Math.max(2,d.nilai/max*100)}%"></i><span>${fmt(d.nilai)}${c.satuan?' '+esc(c.satuan):''}</span></div>`).join('')}</div>`}
function msgHTML(m){return m.role==='user'?esc(m.content).replace(/\n/g,'<br>')+(m.img?`<span class="att">Foto: ${esc(m.img)}</span>`:''):(m.content?md(m.content):'<span class="dots">Gudi sedang berpikir</span>')+(m.charts||[]).map(chartHTML).join('')}

async function sendBuddy(text){

  if(!text)text='Tolong jelaskan foto ini.';
  const file=bFile;bFile=null;$('#bq').value='';
  chat.push({role:'user',content:text,img:file?.name});const idx=chat.push({role:'assistant',content:'',charts:[]})-1;
  bBusy=true;bCtl=new AbortController();renderChat();
  const instr=`Kamu adalah Gudi, asisten AI yang ramah di aplikasi gudang "Gudang tanpa kertas". Jawab dalam bahasa Indonesia yang santai tapi sopan, singkat dan langsung ke inti, pakai poin jika membantu. Gunakan hanya data di bawah; jangan mengarang angka. Jika data yang ditanya tidak ada, katakan terus terang dan sarankan langkahnya.${caps?.tools?' Jika pengguna meminta grafik atau perbandingan angka, panggil alat tampilkan_grafik lalu beri ringkasan singkat. Jika pengguna ingin membuka menu tertentu, panggil buka_menu.':''}
${meName?'Nama pengguna: '+meName+'.':''}
PANDUAN APLIKASI: ${GUIDE}
DATA GUDANG SAAT INI (JSON): ${JSON.stringify(dataContext())}
${file?'Pengguna melampirkan satu foto (terlampir). Jelaskan isinya dalam konteks gudang bila relevan.':''}
PESAN PENGGUNA: ${text}`;
  const turns=[];for(const m of [...chat.slice(0,idx-1).filter(m=>m.content).slice(-10).map(m=>({role:m.role,content:m.content})),{role:'user',content:instr}]){const l=turns[turns.length-1];if(l&&l.role===m.role)l.content+='\n\n'+m.content;else turns.push({...m})}
  while(turns.length&&turns[0].role!=='user')turns.shift();
  const opts={signal:bCtl.signal,onText:({text})=>{chat[idx].content=text;updMsg(idx)}};
  if(file)opts.images=file;
  if(caps?.tools)opts.tools=[
    {name:'tampilkan_grafik',description:'Menampilkan grafik batang di dalam chat. Pakai saat pengguna meminta grafik atau perbandingan angka. Mengembalikan "ok".',
     inputSchema:{type:'object',properties:{judul:{type:'string'},satuan:{type:'string'},data:{type:'array',items:{type:'object',properties:{label:{type:'string'},nilai:{type:'number'}},required:['label','nilai']}}},required:['judul','data']},
     execute(inp){const data=(Array.isArray(inp.data)?inp.data:[]).slice(0,20).map(d=>({label:String(d?.label??''),nilai:Number(d?.nilai)||0}));if(!data.length)throw new Error('data grafik kosong');chat[idx].charts.push({judul:String(inp.judul||'Grafik'),satuan:String(inp.satuan||''),data});updMsg(idx);return'ok, grafik sudah tampil di chat'}},
    {name:'buka_menu',description:'Membuka menu aplikasi untuk pengguna: terima, po, stok, atau riwayat. Mengembalikan "ok".',
     inputSchema:{type:'object',properties:{menu:{type:'string',enum:['terima','po','stok','riwayat']}},required:['menu']},
     execute(inp){const m=String(inp.menu);if(!['terima','po','stok','riwayat'].includes(m))throw new Error('menu tidak dikenal');tab=m;grnView=null;render();return'ok'}}];
  else opts.cache=false;
  try{const r=await sample(turns,opts);chat[idx].content=r.text||chat[idx].content||(chat[idx].charts.length?'':'(Tidak ada jawaban.)');if(r.truncated)chat[idx].content+='\n\n(Jawaban terpotong.)'}
  catch(e){chat[idx].content=(e&&e.text?e.text+'\n\n':'')+(e?.code==='cancelled'?'(Dihentikan.)':e?.code==='not_granted'?'Gudi butuh izin memakai AI. Izinkan saat diminta, lalu coba lagi.':e?.code==='rate_limited'?'Gudi sedang sibuk. Coba lagi sebentar.':e?.code==='image_rejected'?'Foto tidak bisa dibaca. Coba foto lain (JPG/PNG).':'Maaf, Gudi gagal menjawab. Coba lagi.'+(e?.message?' (Detail: '+e.message+')':''))}
  bBusy=false;bCtl=null;renderChat();
}

  else if(a==='sugg')sendBuddy(b.textContent);
  else if(a==='send')sendBuddy($('#bq').value);
  else if(a==='stop'){if(bCtl)bCtl.abort()}
  else if(a==='unfile'){bFile=null;renderChat()}});
$('#buddy').addEventListener('change',e=>{if(e.target.id==='bfile'&&e.target.files?.length){const f=e.target.files[0];if(caps?.images&&f.size>caps.images.maxInputBytes){toast('Foto terlalu besar');return}bFile=f;renderChat();$('#bq').focus()}});
$('#bq').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!bBusy)sendBuddy(e.target.value)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#umenu').hidden){$('#umenu').hidden=true;$('#ubtn').setAttribute('aria-expanded','false');$('#ubtn').focus()}else if(!$('#buddy').hidden)closeBuddy()}});
render();init();
</script>
</body>
</html>
